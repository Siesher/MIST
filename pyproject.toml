[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mits"
version = "0.1.0"
description = "Mathematics Intelligent Tutoring System with Socratic Method"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "MITS Team"}
]
keywords = ["tutoring", "education", "llm", "socratic", "mathematics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "ollama>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sympy>=1.12",
    # Требуется для sympy.parsing.latex.parse_latex (antlr-backend): без него
    # TaskAnswerVerifier молча возвращает None на все задачи (verifier нефункционален).
    # sympy 1.12–1.14 сгенерированы под antlr 4.11.x — держим совместимый диапазон.
    "antlr4-python3-runtime>=4.11,<4.12",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "structlog>=24.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.14.4",
    "pypdf>=6.12.2",
    "pymupdf>=1.27.2.3",
    "pdfplumber>=0.11",
    "json5>=0.9",
    # Backend runtime: раньше жили ТОЛЬКО в backend/requirements.txt, из-за чего
    # `uv sync` (документированный способ установки) не давал импортируемый backend —
    # sqlalchemy и весь auth-стек отсутствовали. Сводим в единый манифест (OSS: клон
    # + `uv sync` = рабочая система). Сверено AST-сканом импортов против объявленного.
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "PyJWT>=2.10.0",
    "argon2-cffi>=23.1.0",
    "websockets>=13.1",
    "jinja2>=3.1.4",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "pynvml>=11.5.0",
    "pillow>=10.0.0",
    "huggingface-hub>=0.20.0",
    "scipy>=1.11.0",
    "networkx>=3.2.0",
    "matplotlib>=3.8.0",
    "python-multipart>=0.0.9",  # FastAPI form/UploadFile (ingest, vision) — иначе роутер падает на импорте
    "python-docx>=1.1.0",  # генерация ВКР-docx (scripts/assemble_vkr, src/*)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
training = [
    "datasets>=2.16.0",
    "trl>=0.7.0",
    "peft>=0.8.0",
    "bitsandbytes>=0.42.0",
    "unsloth>=2024.1",
]
# PDF report rendering. Needs native GTK libs (libgobject/pango/cairo): works
# out-of-the-box on the Linux Docker image, but on Windows requires the GTK3
# runtime — without it the export service degrades to HTML (handled gracefully).
export = [
    "weasyprint>=66",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: test requires a running LLM stack (Ollama/llama-server); deselect with -m 'not live'",
]
