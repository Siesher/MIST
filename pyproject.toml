[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mits"
version = "0.1.0"
description = "Mathematics Intelligent Tutoring System with Socratic Method"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MITS Team"}
]
keywords = ["tutoring", "education", "llm", "socratic", "mathematics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "ollama>=0.3.0",
    "langchain>=0.2.0",
    "langgraph>=0.2.0",
    "gradio>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sympy>=1.12",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "structlog>=24.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=8.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
training = [
    "datasets>=2.16.0",
    "trl>=0.7.0",
    "peft>=0.8.0",
    "bitsandbytes>=0.42.0",
    "unsloth>=2024.1",
]

[project.scripts]
mits = "src.main:main"
mits-ui = "interface.gradio_app:launch"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
