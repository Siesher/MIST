[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mits"
version = "0.1.0"
description = "Mathematics Intelligent Tutoring System with Socratic Method"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "MITS Team"}
]
keywords = ["tutoring", "education", "llm", "socratic", "mathematics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "ollama>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sympy>=1.12",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "structlog>=24.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.14.4",
    "pypdf>=6.12.2",
    "pymupdf>=1.27.2.3",
    "pdfplumber>=0.11",
    "json5>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
training = [
    "datasets>=2.16.0",
    "trl>=0.7.0",
    "peft>=0.8.0",
    "bitsandbytes>=0.42.0",
    "unsloth>=2024.1",
]
# PDF report rendering. Needs native GTK libs (libgobject/pango/cairo): works
# out-of-the-box on the Linux Docker image, but on Windows requires the GTK3
# runtime — without it the export service degrades to HTML (handled gracefully).
export = [
    "weasyprint>=66",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: test requires a running LLM stack (Ollama/llama-server); deselect with -m 'not live'",
]
