version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mits-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    container_name: mits-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=sqlite+aiosqlite:///data/mits.db
    volumes:
      - backend_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: serve
    container_name: mits-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  backend_data:
