# ВНИМАНИЕ: экспериментальная конфигурация, не тестировалась;
# продовый стек = llama-server/llama-swap на хосте (:8090).

version: "3.8"

services:
  # Продовый стек использует llama-server/llama-swap на хосте (порт 8090) — без контейнера.
  # Сервис ollama оставлен как legacy-альтернатива; по умолчанию не запускается.
  # Чтобы включить: docker compose --profile ollama up
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: mits-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    container_name: mits-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      # Сгенерировать: python -c "import secrets; print(secrets.token_urlsafe(64))"
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in host environment}
      - DATABASE_URL=sqlite+aiosqlite:///data/mits.db
      - LLM_BACKEND=llamacpp
      # llama-server/llama-swap на хосте; host-gateway позволяет обращаться к хосту из контейнера
      - LLM_BASE_URL=http://host-gateway:8090/v1
      - CORS_ORIGINS=http://localhost:3000
    extra_hosts:
      - "host-gateway:host-gateway"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: serve
    container_name: mits-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  backend_data:
